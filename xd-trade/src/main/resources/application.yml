server:
  port: 8088  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: trade-service
xd:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.xiaodu.trade.controller
    title: 小杜学堂 - 交易中心接口文档
    description: 该服务提供购物车、订单管理等功能
    contact-name: 小杜有限教育
    version: v1.0
  jdbc:
    database: xd-trade
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - "/order-details/enrollNum"
