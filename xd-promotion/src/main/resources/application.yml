server:
  port: 8092  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: promotion-service
xd:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.xiaodu.promotion.controller
    title: 小杜课堂 - 促销中心接口文档
    description: 该服务包含优惠促销有关的功能
    contact-name: 小杜有限教育
    version: v1.0
  jdbc:
    database: xd-promotion
  auth:
    resource:
      enable: true # 开启登录拦截的功能
  mq:
    listener:
      retry:
        stateless: false # 无状态
  promotion:
    aes:
      key: ${PROMOTION_AES_KEY}
      iv: ${PROMOTION_AES_IV}
