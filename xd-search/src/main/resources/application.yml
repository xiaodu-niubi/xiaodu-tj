server:
  port: 8083  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: search-service
xd:
  swagger:
    enable: true
    package-path: com.xiaodu.search.controller
    title: 小杜学堂 - 搜索系统接口文档
    description: 该服务包含课程搜索、兴趣推荐等相关功能
    contact-name: 小杜有限教育
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /interests/**
        - /courses/admin
  jdbc:
    database: xd-search
