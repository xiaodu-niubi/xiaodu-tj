server:
  port: 8091  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: remark-service
xd:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.xiaodu.remark.controller
    title: 小杜学堂 - 评价中心接口文档
    description: 该服务包含评价、点赞等功能
    contact-name: 小杜有限教育
    version: v1.0
  jdbc:
    database: xd-remark
  auth:
    resource:
      enable: true # 登录拦截功能
